<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="380" viewBox="0 0 1080 380"><rect width="1080" height="380" rx="18" fill="#18212d"/><g font-family="Segoe UI,Arial,sans-serif" fill="#f2f6fc"><text x="38" y="48" font-size="27" font-weight="bold">Prepared Add-on ZIP - no commands needed</text><g font-size="22"><text x="40" y="102">1. Right-click your ORIGINAL game</text><text x="40" y="146">2. Configure Game → Add-ons</text><text x="40" y="190">3. Import Mod from ZIP</text><text x="40" y="234">4. Choose *-Prepared-Addon.zip</text><text x="40" y="278">5. Enable the mod → Apply / OK → launch</text></g><rect x="690" y="110" width="340" height="115" rx="9" fill="#0879b5"/><text x="714" y="160" font-size="23">Import Mod from ZIP</text><text x="714" y="198" font-size="17">Choose the prepared ZIP itself</text><text x="40" y="338" font-size="19" fill="#b1d9f5">Full Hero Mode / Wheel on NUP: use Lichii build 95 with NUP LayeredFS support.</text></g></svg>
